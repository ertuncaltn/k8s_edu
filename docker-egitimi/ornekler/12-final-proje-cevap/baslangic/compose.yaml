# =============================================================================
# Ziyaretçi Defteri — Compose dosyası
# Tüm hassas değerler .env dosyasından gelir; bu dosyada şifre YOKTUR.
# =============================================================================

services:

  api:
    build:
      context: ./app            # .dockerignore bu klasörde olmalı
    image: localhost:5001/${GRUP_ADI:?GRUP_ADI .env içinde tanımlı olmalı}/ziyaretci-defteri:${APP_SURUM:-1.0.0}
    environment:
      # Host olarak "localhost" DEĞİL, servis adı "db" kullanılır (Compose DNS)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_ADI: ${APP_ADI:-Ziyaretçi Defteri}
    ports:
      - "8000:5000"             # Sadece API host'a açık
    depends_on:
      db:
        condition: service_healthy   # DB hazır olmadan api başlamaz
    networks:
      - frontend
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER .env içinde tanımlı olmalı}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB .env içinde tanımlı olmalı}
    volumes:
      - db-verisi:/var/lib/postgresql/data
    healthcheck:
      # $$ → Compose bunu değiştirmez, container içindeki shell değişkeni olarak kalır
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend                 # Sadece backend; "ports:" YOK → host'a kapalı
    restart: unless-stopped

networks:
  frontend:
  backend:

volumes:
  db-verisi:
