# Nginx reverse proxy -> "web" servisine yönlendirir.
# Compose DNS'i "web" adını, ölçeklenmiş TÜM web container'larının IP'lerine çözer;
# nginx bunlar arasında round-robin yük dağıtımı yapar.
# NOT: nginx DNS'i başlangıçta çözer. Scale sonrası: docker compose restart proxy
upstream web_backend {
    server web:5000;
}

server {
    listen 80;

    location / {
        proxy_pass http://web_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
