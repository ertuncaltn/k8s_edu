# ======================================================================
# Compose secrets demosu
#   Çalıştır :  docker compose -f compose.secrets.yaml up
#   Kapat    :  docker compose -f compose.secrets.yaml down
# Secret, ortam değişkeni olarak DEĞİL, dosya olarak /run/secrets/ altına bağlanır.
# ======================================================================
name: secret-demo

services:
  demo:
    image: alpine:3.20
    command: ["sh", "-c", "echo '--- /run/secrets:'; ls -l /run/secrets; echo '--- icerik:'; cat /run/secrets/db_sifre; echo; echo '--- env icinde var mi?'; env | grep -i sifre || echo 'env icinde YOK'"]
    secrets:
      - db_sifre

secrets:
  db_sifre:
    file: ./db_sifre.txt     # gerçek projede bu dosya .gitignore'da olmalı
